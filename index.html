        </div>

function formatearFechaLocal(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function formatearFechaBonita(fechaStr) {
  const [yyyy, mm, dd] = fechaStr.split('-');
  return `${dd}/${mm}/${yyyy}`;
}

function formatearFechaCorta(d) {
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}`;
}

const hoy = new Date();
const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
const anteayer = new Date(hoy); anteayer.setDate(hoy.getDate() - 2);

const pestanas = [
  { id: 'hoy', label: 'Hoy', fecha: formatearFechaLocal(hoy) },
  { id: 'ayer', label: formatearFechaCorta(ayer), fecha: formatearFechaLocal(ayer) },
  { id: 'anteayer', label: formatearFechaCorta(anteayer), fecha: formatearFechaLocal(anteayer) },
  { id: 'otra', label: 'Otra fecha', fecha: null },
];

const tabsEl = document.getElementById('tabs');
const selectorFechaEl = document.getElementById('selectorFecha');
const inputFechaEl = document.getElementById('inputFecha');

pestanas.forEach(p => {
  const el = document.createElement('div');
  el.className = 'tab';
  el.textContent = p.label;
  el.dataset.id = p.id;
  el.addEventListener('click', () => seleccionarPestana(p.id));
  tabsEl.appendChild(el);
});

function seleccionarPestana(id) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('activo', t.dataset.id === id);
  });

  const p = pestanas.find(x => x.id === id);
  if (id === 'otra') {
    selectorFechaEl.classList.add('visible');
    const fechaElegida = inputFechaEl.value || formatearFechaLocal(hoy);
    inputFechaEl.value = fechaElegida;
    mostrarFecha(fechaElegida);
  } else {
    selectorFechaEl.classList.remove('visible');
    mostrarFecha(p.fecha);
  }
}

inputFechaEl.addEventListener('change', () => mostrarFecha(inputFechaEl.value));

let registrosActuales = [];
let filtroActivo = null;

function mostrarFecha(fechaStr) {
  registrosActuales = porFecha[fechaStr] || [];
  filtroActivo = null;
  document.getElementById('fechaTitulo').textContent = formatearFechaBonita(fechaStr);
  renderizarResumenYLista();
}

function renderizarResumenYLista() {
  const resumenEl = document.getElementById('resumen');
  const listaEl = document.getElementById('lista');

  if (registrosActuales.length === 0) {
    resumenEl.innerHTML = '';
    listaEl.innerHTML = '<div class="vacio">No hay registros guardados para esta fecha.</div>';
    return;
  }

  const okCount = registrosActuales.filter(r => r.ok).length;
  const noCount = registrosActuales.length - okCount;
  resumenEl.innerHTML = `
    <div class="ok${filtroActivo === true ? ' activo' : ''}" id="cajaOk">${okCount} OK</div>
    <div class="no${filtroActivo === false ? ' activo' : ''}" id="cajaNo">${noCount} SIN DATOS</div>
  `;
  document.getElementById('cajaOk').addEventListener('click', () => {
    filtroActivo = (filtroActivo === true) ? null : true;
    renderizarResumenYLista();
  });
  document.getElementById('cajaNo').addEventListener('click', () => {
    filtroActivo = (filtroActivo === false) ? null : false;
    renderizarResumenYLista();
  });

  let registrosMostrados = registrosActuales;
  if (filtroActivo === true) registrosMostrados = registrosActuales.filter(r => r.ok);
  if (filtroActivo === false) registrosMostrados = registrosActuales.filter(r => !r.ok);

  listaEl.innerHTML = '';
  if (registrosMostrados.length === 0) {
    listaEl.innerHTML = '<div class="vacio">No hay cartillas en este estado.</div>';
    return;
  }

  registrosMostrados
    .slice()
    .sort((a, b) => a.cartilla.localeCompare(b.cartilla))
    .forEach(r => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="punto ${r.ok ? 'ok' : 'no'}"></span><span>${r.cartilla}</span>`;
      listaEl.appendChild(li);
    });
}

(function() {

  const GH_TOKEN = "";

  function fmtISO(d) {
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${d.getFullYear()}-${mm}-${dd}`;
  }
  function isoToDDMM(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  const hoyCat = new Date();
  const ayerCat = new Date(hoyCat); ayerCat.setDate(hoyCat.getDate() - 1);

  function indicador(prefijo) {
    const enabled = document.getElementById(prefijo + 'Enabled').checked;
    if (!enabled) return { enabled: false };
    const umbral = parseFloat(document.getElementById(prefijo + 'Umbral').value) / 100;
    const cfg = { enabled: true, umbral: umbral, banda_enabled: false };
    const bandaEnabled = document.getElementById(prefijo + 'BandaEnabled').checked;
    if (bandaEnabled) {
      cfg.banda_enabled = true;
      cfg.banda_upper = parseFloat(document.getElementById(prefijo + 'BandaHasta').value) / 100;
      cfg.banda_categoria = parseInt(document.getElementById(prefijo + 'BandaCategoria').value, 10);
    }
    return cfg;
  }

  function armarConfig() {
    return {
      fecha: isoToDDMM(document.getElementById('fecha').value),
      fecha_inicio: isoToDDMM(document.getElementById('fechaInicio').value),
      fecha_fin: isoToDDMM(document.getElementById('fechaFin').value),
      indicadores: {
        LARVA: indicador('larva'),
        SUMA_POSTURAS: indicador('posturas'),
        SUMA_PICADOS: indicador('picados'),
      },
    };
  }

  const btnIniciar = document.getElementById('btnIniciar');
  const progresoCaja = document.getElementById('progresoCaja');
  const progresoTexto = document.getElementById('progresoTexto');
  const progresoBarra = document.getElementById('progresoBarra');
  const resultadoCaja = document.getElementById('resultadoCaja');
  const LS_KEY = 'categorizacion_dispatch_ts';
  let intervaloSondeo = null;

  btnIniciar.addEventListener('click', async () => {
    if (!GH_TOKEN) {
      alert('Falta configurar DISPATCH_TOKEN_FOSFINA en los Secrets del repo (val.py lo necesita para generar esta página).');
      return;
    }
    btnIniciar.disabled = true;
    resultadoCaja.style.display = 'none';
    progresoCaja.style.display = 'block';
    progresoTexto.textContent = 'Enviando orden de inicio...';
    progresoBarra.style.width = '3%';

    const cfg = armarConfig();
    try {
      const resp = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO_PRIVADO}/actions/workflows/${GH_WORKFLOW}/dispatches`,
        {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${GH_TOKEN}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ ref: 'main', inputs: { config_json: JSON.stringify(cfg) } }),
        }
      );
      if (resp.status !== 204) {
        const texto = await resp.text();
        throw new Error(`GitHub respondió ${resp.status}: ${texto}`);
      }
      localStorage.setItem(LS_KEY, Date.now().toString());
      progresoTexto.textContent = 'Iniciado. Puedes minimizar o cerrar esta página, el proceso sigue igual.';
      empezarSondeo();
    } catch (e) {
      progresoTexto.textContent = 'Error al iniciar: ' + e.message;
      btnIniciar.disabled = false;
    }
  });

  function empezarSondeo() {
    if (intervaloSondeo) clearInterval(intervaloSondeo);
    consultarEstado();
    intervaloSondeo = setInterval(consultarEstado, 5000);
  }

  async function consultarEstado() {
    try {
      const resp = await fetch('categorizacion/status.json?_=' + Date.now());
      if (!resp.ok) return;
      const estado = await resp.json();

      const tsDisparo = parseInt(localStorage.getItem(LS_KEY) || '0', 10);
      const tsEstado = new Date(estado.actualizado).getTime();
      if (tsDisparo && tsEstado < tsDisparo - 5000) return;

      progresoCaja.style.display = 'block';
      const pct = Math.round((estado.paso / (estado.total_pasos || 6)) * 100);
      progresoBarra.style.width = Math.max(pct, 4) + '%';
      progresoTexto.textContent = estado.mensaje || '...';

      if (estado.done) {
        clearInterval(intervaloSondeo);
        btnIniciar.disabled = false;
        if (estado.error) {
          progresoTexto.textContent = 'Error: ' + estado.error;
        } else {
          progresoCaja.style.display = 'none';
          mostrarResultado();
        }
      }
    } catch (e) {}
  }

  if (localStorage.getItem(LS_KEY)) empezarSondeo();

  async function mostrarResultado() {
    try {
      const resp = await fetch('categorizacion/ultima.json?_=' + Date.now());
      if (!resp.ok) return;
      renderResultado(await resp.json());

  }

  function renderResultado(data) {
    resultadoCaja.style.display = 'block';

  document.getElementById('btnDescargar').addEventListener('click', async () => {

  function formatearConsola(data) {

    txt += '\n';
    if (data.todo_ok) {
      txt += '✅ Todo categorizado correctamente.\n';
    } else {
      txt += `⚠️ ${(data.problemas || []).length} campo(s) sin categorizar:\n`;
      (data.problemas || []).forEach(p => {
        txt += `   - ${p.unidad_agricola || '(sin unidad)'} / Módulo ${p.modulo || '-'} / Campo ${p.campo} (${p.status})\n`;
      });
    }
    return txt;
  }
})();
</script>
